# Render blueprint for the backend.
#
# No Python version pin is needed any more: every dependency is pure Python or
# ships current wheels, so there is nothing to compile.
services:
  - type: web
    name: jyotish-api
    runtime: python
    plan: free
    # The ephemeris kernel is fetched during the build rather than committed
    # (32 MB) or downloaded on the first request (a slow cold start).
    buildCommand: pip install -e . && python scripts/fetch_ephemeris.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # `sync: false` means Render asks for this once in the dashboard and never
      # keeps it in this file, which is committed. Without it the service still
      # starts and every deterministic endpoint works — chart, panchang, dasha,
      # today, the course. Only /v1/interpret and /v1/chat fail, with a 503 that
      # names this variable, so a deploy missing it looks like an app whose
      # readings are broken rather than an app that is down.
      - key: GEMINI_API_KEY
        sync: false
      # Accounts and credits. Without these the service still starts, /health
      # reports `billing: {accounts: false, credits: false, payments: false}`,
      # and /v1/chat answers anyone who can reach it — which is not a state to
      # deploy in once there is a price list. The service-role key bypasses
      # row-level security and belongs only here; if it has ever been in an app
      # build, rotate it.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Razorpay. The webhook secret is the one typed into the dashboard's
      # webhook form; without it every webhook is rejected and no purchase ever
      # becomes credits. The plan ids come from Subscriptions → Plans, and a
      # subscription whose id is missing is simply not offered for sale.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_YEARLY
        sync: false

      - key: CORS_ORIGINS
        # Narrow this before launch. The mobile app sends no credentials, so a
        # wide value is not a session risk, but it does leave the API open to
        # use from any web origin — and every request from one spends this
        # project's model quota.
        value: "*"
