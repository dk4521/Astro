# Render blueprint for the backend.
#
# No Python version pin is needed any more: every dependency is pure Python or
# ships current wheels, so there is nothing to compile.
services:
  - type: web
    name: jyotish-api
    runtime: python
    plan: free
    # The ephemeris kernel is fetched during the build rather than committed
    # (32 MB) or downloaded on the first request (a slow cold start).
    buildCommand: pip install -e . && python scripts/fetch_ephemeris.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # `sync: false` means Render asks for this once in the dashboard and never
      # keeps it in this file, which is committed. Without it the service still
      # starts and every deterministic endpoint works — chart, panchang, dasha,
      # today, the course. Only /v1/interpret and /v1/chat fail, with a 503 that
      # names this variable, so a deploy missing it looks like an app whose
      # readings are broken rather than an app that is down.
      - key: GEMINI_API_KEY
        sync: false
      # Accounts. Without these nobody can be identified and every AI
      # endpoint answers anyone who can reach it — which is not a state to
      # deploy in once there is a price list. The service says so in its
      # startup log; /health deliberately no longer does, because that was an
      # unauthenticated answer to "is the paywall switched on".
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # RevenueCat's SECRET key, which is what decides whether a caller has
      # paid. The publishable keys ship inside the app and belong in
      # mobile/.env; this one belongs only here. Missing it does not fail the
      # deploy — it silently opens every AI endpoint, so check the startup log.
      - key: REVENUECAT_SECRET_KEY
        sync: false

      # Reads /v1/health/cache. Unset, that path 404s.
      - key: METRICS_TOKEN
        sync: false

      - key: CORS_ORIGINS
        # Browser origins only. The native app sends no Origin header, so this
        # governs `expo start --web` and any web build — not the phone. Unset,
        # the server allows localhost and nothing else, which is the safe
        # default; name real origins here when there is a web front end.
        sync: false
