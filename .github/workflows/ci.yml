name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The 32 MB JPL DE440s kernel is not committed (see .gitignore).
      # Cached so only the first run downloads it.
      - name: Cache JPL ephemeris kernel
        uses: actions/cache@v4
        with:
          path: backend/data/de440s.bsp
          key: jpl-de440s-v1

      - name: Fetch ephemeris kernel
        run: python scripts/fetch_ephemeris.py

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

  mobile:
    name: Mobile (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit
